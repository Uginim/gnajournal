name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-check:
    # ~/workspace/runners/gnajournal 에 등록된 셀프호스티드 macOS arm64 러너로 간다.
    # 러너가 있는 맥이 꺼져 있어 잡이 큐에 쌓이면, 코드 수정 없이 저장소 변수로
    # 호스팅 러너에 되돌린다.
    #   gh variable set RUNNER_LABEL --body ubuntu-latest
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        # cache: 'npm' 을 쓰지 않는다. 셀프호스티드 러너는 머신에 npm 캐시가
        # 영구 보존되므로 GitHub Actions Cache 에 또 올릴 필요가 없다.
        # chess-motif-stats 에서 post-job 캐시 저장이 7.7 GB 업로드를 시도하다
        # 약 1.5시간 뒤 SAS 토큰 만료로 잡 전체가 실패한 사례가 있다(빌드 자체는 성공).
        # ubuntu-latest 로 되돌릴 경우 install 이 조금 더 걸리지만 자주 있는
        # 경로가 아니므로 감수한다.

      - name: Install
        run: npm ci

      # 규칙의 단일 출처는 scripts/check-blog-style.sh 다.
      # Claude Code 훅도 같은 스크립트를 호출한다. 사람이 직접 편집하거나
      # 다른 도구로 고친 경우에도 여기서 걸린다.
      - name: 글쓰기 스타일 검사
        run: |
          shopt -s nullglob
          files=(src/content/blog/*.md src/content/blog/*.mdx)
          if [ ${#files[@]} -eq 0 ]; then
            echo "검사할 글이 없다."
            exit 0
          fi
          echo "검사 대상 ${#files[@]}편"
          ./scripts/check-blog-style.sh "${files[@]}"

      # 빌드가 콘텐츠 스키마와 이미지 참조를 함께 검증한다.
      # 공개 글에 category 가 없거나, 참조한 이미지가 저장소에 없으면 여기서 실패한다.
      - name: Build
        run: npm run build
