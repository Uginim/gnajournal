<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="'Pretendard','Malgun Gothic',sans-serif">
  <rect width="680" height="260" fill="#ffffff"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#111827">노선에 거리 기준을 부여하면</text>
  <text x="24" y="60" font-size="13" fill="#6b7280">선 위의 위치를 출발점부터의 거리로 표현할 수 있다</text>
  <!-- route as a gently curved path -->
  <path d="M60 170 C 180 120, 240 210, 360 160 S 560 120, 630 150" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <!-- tick marks along path (approx positions) -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="60" y1="170" x2="60" y2="150"/>
    <line x1="200" y1="150" x2="200" y2="130"/>
    <line x1="340" y1="163" x2="340" y2="143"/>
    <line x1="480" y1="139" x2="480" y2="119"/>
    <line x1="630" y1="150" x2="630" y2="130"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="60" y="200">0 m</text>
    <text x="200" y="182">250 m</text>
    <text x="340" y="195">500 m</text>
    <text x="480" y="171">750 m</text>
    <text x="630" y="182">1000 m</text>
  </g>
  <text x="60" y="130" font-size="12" fill="#2563eb" text-anchor="middle">출발점</text>
</svg>
