<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1020" height="510" fill="#f7f7fb"/>

  <text x="90" y="80" font-size="28" font-weight="700" fill="#1f2330">지우고 새로 넣었는데 왜 중복 오류가 날까</text>

  <!-- 왼쪽: 코드가 말한 순서 -->
  <text x="260" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">코드가 말한 순서</text>
  <rect x="110" y="170" width="300" height="70" rx="8" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="260" y="200" text-anchor="middle" font-size="18" fill="#4f46e5">1. clear()</text>
  <text x="260" y="226" text-anchor="middle" font-size="16" fill="#4f46e5">기존 행 전부 삭제</text>
  <rect x="110" y="270" width="300" height="70" rx="8" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="260" y="300" text-anchor="middle" font-size="18" fill="#4f46e5">2. add()</text>
  <text x="260" y="326" text-anchor="middle" font-size="16" fill="#4f46e5">새 행 삽입</text>
  <text x="260" y="400" text-anchor="middle" font-size="17" font-weight="600" fill="#4f46e5">삭제가 먼저라고 생각함</text>

  <!-- 화살표 -->
  <text x="510" y="265" text-anchor="middle" font-size="26" fill="#80828f">→</text>

  <!-- 오른쪽: DB에 나간 순서 -->
  <text x="760" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">DB에 나간 순서</text>
  <rect x="610" y="170" width="300" height="70" rx="8" fill="#fdf1ea" stroke="#d9480f" stroke-width="2.5"/>
  <text x="760" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#d9480f">1. INSERT</text>
  <text x="760" y="226" text-anchor="middle" font-size="16" fill="#d9480f">기존 행이 살아 있어 Duplicate entry</text>
  <rect x="610" y="270" width="300" height="70" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="760" y="300" text-anchor="middle" font-size="18" fill="#a0a2b0">2. DELETE</text>
  <text x="760" y="326" text-anchor="middle" font-size="16" fill="#a0a2b0">실행되지 못함</text>
  <text x="760" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#d9480f">삽입이 먼저 실행됨</text>

  <text x="90" y="470" font-size="19" font-weight="600" fill="#1f2330">코드에서 먼저 지워도 DELETE는 INSERT 뒤에 실행됩니다.</text>
</svg>
