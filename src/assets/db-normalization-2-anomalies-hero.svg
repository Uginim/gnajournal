<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 574" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1020" height="574" fill="#f7f7fb"/>

  <text x="90" y="78" font-size="28" font-weight="700" fill="#1f2330">이상현상과 함수적 종속</text>

  <text x="260" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">부서 정보가 행마다 반복</text>
  <rect x="110" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="126" y="205" width="268" height="40" rx="6" fill="#f1f3f5" stroke="#c6c8d4" stroke-width="1.5"/>
  <text x="260" y="231" text-anchor="middle" font-size="15" fill="#5b5e6b">김민준, 영업부, 박부장</text>
  <rect x="126" y="253" width="268" height="40" rx="6" fill="#f1f3f5" stroke="#c6c8d4" stroke-width="1.5"/>
  <text x="260" y="279" text-anchor="middle" font-size="15" fill="#5b5e6b">이서연, 영업부, 박부장</text>
  <rect x="126" y="301" width="268" height="40" rx="6" fill="#f1f3f5" stroke="#c6c8d4" stroke-width="1.5"/>
  <text x="260" y="327" text-anchor="middle" font-size="15" fill="#5b5e6b">박지호, 개발부, 정부장</text>
  <text x="260" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#d9480f">같은 부서 정보가 중복 저장</text>

  <text x="760" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">세 가지 이상현상</text>
  <rect x="610" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="626" y="205" width="268" height="58" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="760" y="240" text-anchor="middle" font-size="16" fill="#d9480f">삽입 이상: 부서만 못 넣음</text>
  <rect x="626" y="273" width="268" height="58" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="760" y="308" text-anchor="middle" font-size="16" fill="#d9480f">갱신 이상: 일부만 바뀜</text>
  <rect x="626" y="341" width="268" height="58" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="760" y="376" text-anchor="middle" font-size="16" fill="#d9480f">삭제 이상: 부서까지 사라짐</text>

  <text x="90" y="497" font-size="19" font-weight="600" fill="#1f2330">부서 정보가 직원 행마다 반복되면 삽입, 갱신, 삭제에서 이상현상이 생깁니다.</text>
</svg>
