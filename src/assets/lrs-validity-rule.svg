<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Pretendard','Malgun Gothic',sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#111827">세 정류장의 순서로 오투영을 가려낸다</text>
  <text x="24" y="56" font-size="13" fill="#6b7280">직전(A), 현재(B), 직후(C)의 measure 순서는 6가지. 원본 로직이 정상으로 본 것은 3가지다</text>

  <!-- valid column -->
  <text x="40" y="92" font-size="14" font-weight="700" fill="#16a34a">정상</text>
  <g>
    <rect x="40" y="104" width="240" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="160" y="126" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">A &lt; B &lt; C</text>
    <rect x="40" y="146" width="240" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="160" y="168" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">B &lt; C &lt; A</text>
    <rect x="40" y="188" width="240" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="160" y="210" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">C &lt; A &lt; B</text>
  </g>

  <!-- invalid column -->
  <text x="400" y="92" font-size="14" font-weight="700" fill="#dc2626">오투영</text>
  <g>
    <rect x="400" y="104" width="240" height="34" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="520" y="126" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">A &lt; C &lt; B</text>
    <rect x="400" y="146" width="240" height="34" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="520" y="168" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">C &lt; B &lt; A</text>
    <rect x="400" y="188" width="240" height="34" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="520" y="210" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">B &lt; A &lt; C</text>
  </g>

  <text x="24" y="258" font-size="13" fill="#374151">여섯 가지 순서 중 세 가지만 정상이다. 세 가지가 나온 근거는 본문에서 설명한다.</text>
  <text x="24" y="280" font-size="12" fill="#9ca3af">※ 첫 정류장과 마지막 정류장, 투영 직선거리(offset)가 큰 경우는 별도 처리</text>
</svg>
