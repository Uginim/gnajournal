<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <text x="10" y="18" font-size="13" font-weight="700" fill="#1f2330">같은 작업, 압축 여부에 따른 토큰과 비용</text>

  <text x="245" y="46" text-anchor="middle" font-size="11" fill="#80828f">전송 토큰</text>
  <text x="500" y="46" text-anchor="middle" font-size="11" fill="#80828f">비용 상당</text>

  <!-- 압축 없음 -->
  <text x="10" y="74" font-size="12" font-weight="700" fill="#1f2330">압축 없음</text>
  <rect x="95" y="56" width="300" height="28" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="245" y="74" text-anchor="middle" font-size="11" fill="#4f46e5">100 토큰, 캐시 읽기 0.1배</text>
  <rect x="440" y="56" width="30" height="28" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="478" y="74" font-size="11.5" font-weight="700" fill="#4f46e5">10</text>

  <!-- 압축 프록시 -->
  <text x="10" y="130" font-size="12" font-weight="700" fill="#1f2330">압축 프록시</text>
  <rect x="95" y="112" width="120" height="28" fill="#fdf1ea" stroke="#d9480f" stroke-width="1.3"/>
  <text x="155" y="130" text-anchor="middle" font-size="11" fill="#d9480f">40 토큰</text>
  <text x="222" y="130" font-size="11" fill="#d9480f">전부 재계산 1.0배</text>
  <rect x="440" y="112" width="120" height="28" fill="#fdf1ea" stroke="#d9480f" stroke-width="1.3"/>
  <text x="568" y="130" font-size="11.5" font-weight="700" fill="#d9480f">40</text>

  <text x="10" y="176" font-size="11.5" font-weight="600" fill="#d9480f">토큰은 60% 줄었는데 비용은 네 배입니다. 압축이 prefix를 바꿔 매 요청 캐시 미스가 나기 때문입니다.</text>
</svg>
