<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="'Pretendard','Malgun Gothic',sans-serif">
  <rect width="680" height="260" fill="#ffffff"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#111827">정류장을 노선 위에 투영</text>
  <text x="24" y="60" font-size="13" fill="#6b7280">정류장 좌표와 가장 가까운 노선 위의 점을 찾고 Measure를 구한다</text>
  <path d="M60 180 C 200 140, 380 200, 620 150" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <!-- stop point off the line -->
  <circle cx="330" cy="120" r="7" fill="#e11d48"/>
  <text x="330" y="108" font-size="12" fill="#e11d48" text-anchor="middle">정류장</text>
  <!-- projected point on line -->
  <circle cx="330" cy="171" r="6" fill="#111827"/>
  <!-- perpendicular dashed -->
  <line x1="330" y1="127" x2="330" y2="165" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="345" y="150" font-size="11" fill="#6b7280">offset</text>
  <text x="330" y="196" font-size="12" fill="#111827" text-anchor="middle">투영점 · measure ≈ 540 m</text>
  <text x="60" y="205" font-size="12" fill="#2563eb">출발점(0 m)</text>
</svg>
