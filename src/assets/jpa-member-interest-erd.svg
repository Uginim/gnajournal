<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- member 테이블 -->
  <rect x="90" y="80" width="260" height="150" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="90" y="80" width="260" height="46" rx="8" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="220" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2330">member</text>
  <text x="112" y="160" font-size="16" fill="#1f2330">id (PK)</text>
  <text x="112" y="192" font-size="16" fill="#80828f">name, …</text>

  <!-- 관계선 1:N -->
  <line x1="350" y1="155" x2="560" y2="155" stroke="#80828f" stroke-width="2"/>
  <text x="365" y="145" font-size="15" fill="#80828f">1</text>
  <text x="540" y="145" font-size="15" fill="#80828f">N</text>

  <!-- member_interest 테이블 -->
  <rect x="560" y="60" width="330" height="230" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="560" y="60" width="330" height="46" rx="8" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="725" y="90" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2330">member_interest</text>
  <text x="582" y="140" font-size="16" fill="#1f2330">id (PK)</text>
  <rect x="572" y="156" width="306" height="34" rx="5" fill="#eef0ff"/>
  <text x="582" y="179" font-size="16" fill="#4f46e5">member_id (FK)</text>
  <rect x="572" y="196" width="306" height="34" rx="5" fill="#eef0ff"/>
  <text x="582" y="219" font-size="16" fill="#4f46e5">interest_id</text>
  <text x="582" y="266" font-size="15" fill="#80828f">그 외 컬럼 없음 (순수 매핑 테이블)</text>

  <!-- UK 라벨 -->
  <path d="M 894 156 L 906 156 L 906 230 L 894 230" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <text x="914" y="185" font-size="15" font-weight="700" fill="#4f46e5">이 조합이</text>
  <text x="914" y="207" font-size="15" font-weight="700" fill="#4f46e5">유니크해야 함</text>

  <text x="90" y="360" font-size="17" fill="#1f2330">한 회원이 같은 관심분야를 두 번 가질 수 없도록, 두 컬럼의 조합에 유니크키를 걸었습니다.</text>
  <text x="90" y="390" font-size="17" font-weight="600" fill="#4f46e5">UNIQUE KEY uk_member_interest (member_id, interest_id)</text>
</svg>
