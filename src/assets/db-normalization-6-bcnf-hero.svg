<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 574" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1020" height="574" fill="#f7f7fb"/>

  <text x="90" y="78" font-size="28" font-weight="700" fill="#1f2330">보이스-코드 정규형 (BCNF)</text>

  <text x="260" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">결정자가 후보키가 아님</text>
  <rect x="110" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="146" y="262" width="228" height="52" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="260" y="294" text-anchor="middle" font-size="17" fill="#d9480f">교수 → 과목</text>
  <text x="260" y="360" text-anchor="middle" font-size="15" fill="#7a7c88">교수는 후보키가 아님</text>

  <text x="760" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">결정자 기준으로 분리</text>
  <rect x="610" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="626" y="230" width="268" height="52" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="760" y="262" text-anchor="middle" font-size="15" fill="#4f46e5">교수-과목: 교수 → 과목</text>
  <rect x="626" y="310" width="268" height="52" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="760" y="342" text-anchor="middle" font-size="15" fill="#4f46e5">수강: {학생, 교수}</text>

  <text x="90" y="497" font-size="19" font-weight="600" fill="#1f2330">후보키가 아닌 결정자가 있으면, 그 결정자를 기준으로 테이블을 분리합니다.</text>
</svg>
