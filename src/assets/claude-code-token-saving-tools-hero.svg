<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 574" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1020" height="574" fill="#f7f7fb"/>

  <text x="90" y="105" font-size="28" font-weight="700" fill="#1f2330">같은 작업, 압축 여부에 따른 토큰과 비용</text>

  <text x="470" y="165" text-anchor="middle" font-size="19" fill="#80828f">전송 토큰</text>
  <text x="866" y="165" text-anchor="middle" font-size="19" fill="#80828f">비용 상당</text>

  <!-- 압축 없음 -->
  <text x="90" y="217" font-size="20" font-weight="700" fill="#1f2330">압축 없음</text>
  <rect x="230" y="185" width="480" height="48" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="470" y="217" text-anchor="middle" font-size="18" fill="#4f46e5">100 토큰, 캐시 읽기 0.1배</text>
  <rect x="770" y="185" width="48" height="48" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="834" y="217" font-size="20" font-weight="700" fill="#4f46e5">10</text>

  <!-- 압축 프록시 -->
  <text x="90" y="317" font-size="20" font-weight="700" fill="#1f2330">압축 프록시</text>
  <rect x="230" y="285" width="192" height="48" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="326" y="317" text-anchor="middle" font-size="18" fill="#d9480f">40 토큰</text>
  <text x="440" y="317" font-size="18" fill="#d9480f">전부 재계산 1.0배</text>
  <rect x="770" y="285" width="192" height="48" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="974" y="317" font-size="20" font-weight="700" fill="#d9480f">40</text>

  <text x="90" y="412" font-size="19" font-weight="600" fill="#d9480f">토큰은 60% 줄었는데 비용은 네 배입니다. 압축이 prefix를 바꿔 매 요청 캐시 미스가 나기 때문입니다.</text>
</svg>
