  <text x="30" y="46" font-size="12.5" font-weight="700" fill="#d9480f">✕ 조합이 곱해져 저장됨</text>

  <rect x="30" y="56" width="110" height="30" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.4"/>
