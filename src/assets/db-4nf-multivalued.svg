  <rect x="230" y="56" width="90" height="30" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="85" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f46e5">과목</text>
