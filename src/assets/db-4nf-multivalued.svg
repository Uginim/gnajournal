  <text x="275" y="133" text-anchor="middle" font-size="12" fill="#1f2330">정교수</text>

  <rect x="30" y="142" width="110" height="28" fill="#ffffff" stroke="#cfd0db" stroke-width="1"/>
  <rect x="140" y="142" width="90" height="28" fill="#fff4ec" stroke="#cfd0db" stroke-width="1"/>
  <rect x="230" y="142" width="90" height="28" fill="#fff4ec" stroke="#cfd0db" stroke-width="1"/>
  <text x="85" y="161" text-anchor="middle" font-size="12" fill="#1f2330">데이터베이스</text>
  <text x="185" y="161" text-anchor="middle" font-size="12" fill="#1f2330">교재B</text>
  <text x="275" y="161" text-anchor="middle" font-size="12" fill="#1f2330">박교수</text>

  <rect x="30" y="170" width="110" height="28" fill="#ffffff" stroke="#cfd0db" stroke-width="1"/>
  <rect x="140" y="170" width="90" height="28" fill="#fff4ec" stroke="#cfd0db" stroke-width="1"/>
  <rect x="230" y="170" width="90" height="28" fill="#fff4ec" stroke="#cfd0db" stroke-width="1"/>
  <text x="85" y="189" text-anchor="middle" font-size="12" fill="#1f2330">데이터베이스</text>
  <text x="185" y="189" text-anchor="middle" font-size="12" fill="#1f2330">교재B</text>
  <text x="275" y="189" text-anchor="middle" font-size="12" fill="#1f2330">정교수</text>

  <text x="30" y="220" font-size="12.5" font-weight="600" fill="#d9480f">교재 2권과 교수 2명이 네 줄로 저장됩니다</text>
  <text x="30" y="240" font-size="12" fill="#80828f">교재를 한 권 더 넣으려면 두 줄을 넣어야 합니다</text>

  <!-- 가운데 화살표 -->
  <path d="M 336 128 L 400 128" stroke="#5b5fb0" stroke-width="2" fill="none" marker-end="url(#arrow4nf)"/>
  <text x="368" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#5b5fb0">과목 ↠ 교재</text>
  <text x="368" y="150" text-anchor="middle" font-size="12" fill="#5b5fb0">기준으로 분리</text>

  <!-- 오른쪽: 두 표 -->
  <text x="420" y="46" font-size="12.5" font-weight="700" fill="#2f9e44">✓ 관계마다 표를 나눔</text>

  <rect x="420" y="56" width="110" height="30" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="530" y="56" width="90" height="30" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="475" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f46e5">과목</text>
  <text x="575" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f46e5">교재</text>

  <rect x="420" y="86" width="110" height="28" fill="#ffffff" stroke="#cfd0db" stroke-width="1"/>
  <rect x="530" y="86" width="90" height="28" fill="#eef9f0" stroke="#cfd0db" stroke-width="1"/>
  <text x="475" y="105" text-anchor="middle" font-size="12" fill="#1f2330">데이터베이스</text>
  <text x="575" y="105" text-anchor="middle" font-size="12" fill="#1f2330">교재A</text>

  <rect x="420" y="114" width="110" height="28" fill="#ffffff" stroke="#cfd0db" stroke-width="1"/>
  <rect x="530" y="114" width="90" height="28" fill="#eef9f0" stroke="#cfd0db" stroke-width="1"/>
  <text x="475" y="133" text-anchor="middle" font-size="12" fill="#1f2330">데이터베이스</text>
  <text x="575" y="133" text-anchor="middle" font-size="12" fill="#1f2330">교재B</text>

  <rect x="420" y="162" width="110" height="30" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="530" y="162" width="90" height="30" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="475" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f46e5">과목</text>
  <text x="575" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f46e5">교수</text>

  <rect x="420" y="192" width="110" height="28" fill="#ffffff" stroke="#cfd0db" stroke-width="1"/>
  <rect x="530" y="192" width="90" height="28" fill="#eef9f0" stroke="#cfd0db" stroke-width="1"/>
  <text x="475" y="211" text-anchor="middle" font-size="12" fill="#1f2330">데이터베이스</text>
  <text x="575" y="211" text-anchor="middle" font-size="12" fill="#1f2330">박교수</text>

  <rect x="420" y="220" width="110" height="28" fill="#ffffff" stroke="#cfd0db" stroke-width="1"/>
  <rect x="530" y="220" width="90" height="28" fill="#eef9f0" stroke="#cfd0db" stroke-width="1"/>
  <text x="475" y="239" text-anchor="middle" font-size="12" fill="#1f2330">데이터베이스</text>
  <text x="575" y="239" text-anchor="middle" font-size="12" fill="#1f2330">정교수</text>

  <text x="420" y="270" font-size="12.5" font-weight="600" fill="#2f9e44">두 줄과 두 줄로 나뉩니다</text>
  <text x="420" y="290" font-size="12" fill="#80828f">교재를 한 권 더 넣으면 한 줄만 추가합니다</text>

  <text x="30" y="322" font-size="12.5" font-weight="600" fill="#5b5fb0">두 표를 과목으로 조인하면 원래 네 줄이 그대로 복원됩니다.</text>
