<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a96"/>
    </marker>
    <marker id="awarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
  </defs>

  <!-- 왼쪽: 일반 테이블 -->
  <rect x="24" y="30" width="326" height="342" rx="12" fill="#fff7f4" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="187" y="54" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b8410e">일반 테이블 하나를 돌려쓸 때</text>

  <rect x="52" y="70" width="270" height="34" rx="7" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="187" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2330">1. DELETE로 지난 데이터를 비움</text>

  <line x1="187" y1="106" x2="187" y2="130" stroke="#d9480f" stroke-width="1.7" marker-end="url(#awarn)"/>

  <rect x="52" y="132" width="270" height="94" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="1.3"/>
  <text x="70" y="156" font-size="12.5" fill="#7a3410">지우는 행마다 undo가 생기고</text>
  <text x="70" y="178" font-size="12.5" fill="#7a3410">그 undo가 redo에 기록됨</text>
  <text x="70" y="200" font-size="12.5" fill="#7a3410">인덱스도 함께 정리됨</text>
  <text x="70" y="220" font-size="12.5" fill="#7a3410">최고 사용 지점은 그대로 남음</text>

  <line x1="187" y1="228" x2="187" y2="250" stroke="#8a8a96" stroke-width="1.6" marker-end="url(#agray)"/>

  <rect x="52" y="252" width="270" height="32" rx="7" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="187" y="273" text-anchor="middle" font-size="14" fill="#1f2330">2. INSERT로 이번 중간 결과를 쌓음</text>

  <line x1="187" y1="286" x2="187" y2="306" stroke="#8a8a96" stroke-width="1.6" marker-end="url(#agray)"/>

  <rect x="52" y="308" width="270" height="32" rx="7" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="187" y="329" text-anchor="middle" font-size="14" fill="#1f2330">3. SELECT로 읽어 요약본을 만듦</text>

  <text x="187" y="360" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b8410e">비운 뒤에도 전체 스캔은 빈 블록까지 읽음</text>

  <!-- 가운데 화살표 -->
  <line x1="362" y1="200" x2="398" y2="200" stroke="#8a8a96" stroke-width="1.8" marker-end="url(#agray)"/>
  <text x="380" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#555">교체</text>

  <!-- 오른쪽: Global Temporary Table -->
  <rect x="410" y="30" width="326" height="342" rx="12" fill="#f2fbf4" stroke="#2b8a3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="573" y="54" text-anchor="middle" font-size="13.5" font-weight="700" fill="#237032">Global Temporary Table로 바꿀 때</text>

  <rect x="438" y="70" width="270" height="34" rx="7" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="573" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#237032">1. 비우는 단계가 없음</text>

  <line x1="573" y1="106" x2="573" y2="130" stroke="#2b8a3e" stroke-width="1.7" marker-end="url(#aok)"/>

  <rect x="438" y="132" width="270" height="94" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.3"/>
  <text x="456" y="156" font-size="12.5" fill="#1d5c2a">지울 행이 없으니 그만큼의</text>
  <text x="456" y="178" font-size="12.5" fill="#1d5c2a">undo도 인덱스 정리도 안 생김</text>
  <text x="456" y="200" font-size="12.5" fill="#1d5c2a">커밋이나 세션 종료 때</text>
  <text x="456" y="220" font-size="12.5" fill="#1d5c2a">데이터가 자동으로 비워짐</text>

  <line x1="573" y1="228" x2="573" y2="250" stroke="#8a8a96" stroke-width="1.6" marker-end="url(#agray)"/>

  <rect x="438" y="252" width="270" height="32" rx="7" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="573" y="273" text-anchor="middle" font-size="14" fill="#1f2330">2. INSERT로 이번 중간 결과를 쌓음</text>

  <line x1="573" y1="286" x2="573" y2="306" stroke="#8a8a96" stroke-width="1.6" marker-end="url(#agray)"/>

  <rect x="438" y="308" width="270" height="32" rx="7" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="573" y="329" text-anchor="middle" font-size="14" fill="#1f2330">3. SELECT로 읽어 요약본을 만듦</text>

  <text x="573" y="360" text-anchor="middle" font-size="12.5" font-weight="600" fill="#237032">지우는 코드가 배치에서 사라짐</text>
</svg>
