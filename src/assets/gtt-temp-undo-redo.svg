<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a96"/>
    </marker>
    <marker id="uw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="uo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
  </defs>

  <!-- 위: TEMP_UNDO_ENABLED = FALSE (기본) -->
  <rect x="24" y="24" width="712" height="122" rx="12" fill="#fff7f4" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="48" font-size="13" font-weight="700" fill="#b8410e">TEMP_UNDO_ENABLED = FALSE (기본값)</text>

  <rect x="44" y="62" width="176" height="60" rx="8" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="132" y="88" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2330">Global Temporary Table</text>
  <text x="132" y="108" text-anchor="middle" font-size="12.5" fill="#555">INSERT, DELETE</text>

  <line x1="222" y1="92" x2="286" y2="92" stroke="#8a8a96" stroke-width="1.6" marker-end="url(#ug)"/>
  <text x="254" y="82" text-anchor="middle" font-size="11.5" fill="#555">undo 생성</text>

  <rect x="288" y="62" width="176" height="60" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="1.3"/>
  <text x="376" y="88" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2330">undo 테이블스페이스</text>
  <text x="376" y="108" text-anchor="middle" font-size="12.5" fill="#7a3410">영구 데이터와 같은 곳</text>

  <line x1="466" y1="92" x2="530" y2="92" stroke="#d9480f" stroke-width="1.8" marker-end="url(#uw)"/>
  <text x="498" y="82" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b8410e">기록됨</text>

  <rect x="532" y="62" width="182" height="60" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="1.6"/>
  <text x="623" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b8410e">redo 로그</text>
  <text x="623" y="108" text-anchor="middle" font-size="12.5" fill="#7a3410">undo만큼 redo가 늘어남</text>

  <!-- 아래: TEMP_UNDO_ENABLED = TRUE -->
  <rect x="24" y="170" width="712" height="122" rx="12" fill="#f2fbf4" stroke="#2b8a3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="194" font-size="13" font-weight="700" fill="#237032">TEMP_UNDO_ENABLED = TRUE (Oracle 12c부터)</text>

  <rect x="44" y="208" width="176" height="60" rx="8" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="132" y="234" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2330">Global Temporary Table</text>
  <text x="132" y="254" text-anchor="middle" font-size="12.5" fill="#555">INSERT, DELETE</text>

  <line x1="222" y1="238" x2="286" y2="238" stroke="#8a8a96" stroke-width="1.6" marker-end="url(#ug)"/>
  <text x="254" y="228" text-anchor="middle" font-size="11.5" fill="#555">undo 생성</text>

  <rect x="288" y="208" width="176" height="60" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.3"/>
  <text x="376" y="234" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2330">임시 테이블스페이스</text>
  <text x="376" y="254" text-anchor="middle" font-size="12.5" fill="#1d5c2a">세션 데이터가 있는 곳</text>

  <line x1="466" y1="238" x2="530" y2="238" stroke="#2b8a3e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#uo)"/>
  <text x="498" y="228" text-anchor="middle" font-size="11.5" font-weight="600" fill="#237032">기록되지 않음</text>

  <rect x="532" y="208" width="182" height="60" rx="8" fill="#ffffff" stroke="#cfd0db" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="623" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#237032">redo 로그</text>
  <text x="623" y="254" text-anchor="middle" font-size="12.5" fill="#1d5c2a">그만큼 redo가 줄어듦</text>

  <text x="380" y="312" text-anchor="middle" font-size="12.5" font-weight="600" fill="#555">undo가 어디에 저장되는지가 redo 기록 여부를 가른다</text>
</svg>
