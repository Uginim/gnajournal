<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 574" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1020" height="574" fill="#f7f7fb"/>

  <text x="90" y="78" font-size="28" font-weight="700" fill="#1f2330">제2정규형 (2NF)</text>

  <text x="260" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">복합키의 일부에만 종속</text>
  <rect x="110" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="126" y="222" width="268" height="52" rx="6" fill="#f1f3f5" stroke="#c6c8d4" stroke-width="1.5"/>
  <text x="260" y="254" text-anchor="middle" font-size="15" fill="#5b5e6b">{주문번호, 상품번호}</text>
  <rect x="146" y="316" width="228" height="52" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="260" y="348" text-anchor="middle" font-size="15" fill="#d9480f">상품명 (상품번호에만 종속)</text>

  <text x="760" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">종속 대상별로 분리</text>
  <rect x="610" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="626" y="230" width="268" height="52" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="760" y="262" text-anchor="middle" font-size="15" fill="#4f46e5">주문상품: 주문번호, 상품번호</text>
  <rect x="626" y="310" width="268" height="52" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="760" y="342" text-anchor="middle" font-size="15" fill="#4f46e5">상품: 상품번호 → 상품명</text>

  <text x="90" y="497" font-size="19" font-weight="600" fill="#1f2330">복합키의 일부에만 종속되는 속성을 별도 테이블로 분리합니다.</text>
</svg>
