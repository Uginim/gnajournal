<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510">
  <rect width="1020" height="510" fill="#f7f7fb"/>

  <!-- 컨텍스트 윈도우 트랙 (연한 외곽) -->
  <rect x="110" y="120" width="800" height="54" rx="10" fill="#ffffff" stroke="#e3e4ec" stroke-width="2"/>
  <rect x="110" y="228" width="800" height="54" rx="10" fill="#ffffff" stroke="#e3e4ec" stroke-width="2"/>
  <rect x="110" y="336" width="800" height="54" rx="10" fill="#ffffff" stroke="#e3e4ec" stroke-width="2"/>

  <!-- 요청 1: prefix 짧음 + 새 내용 -->
  <rect x="110" y="120" width="200" height="54" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="322" y="120" width="64" height="54" rx="10" fill="#eef9f0" stroke="#2f9e44" stroke-width="2.5"/>

  <!-- 요청 2: prefix가 이전 전체를 흡수 -->
  <rect x="110" y="228" width="276" height="54" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="398" y="228" width="96" height="54" rx="10" fill="#eef9f0" stroke="#2f9e44" stroke-width="2.5"/>

  <!-- 요청 3: 더 길어진 prefix -->
  <rect x="110" y="336" width="384" height="54" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="506" y="336" width="128" height="54" rx="10" fill="#eef9f0" stroke="#2f9e44" stroke-width="2.5"/>

  <!-- 재사용을 나타내는 점선 연결 -->
  <path d="M210,180 V222" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 5" opacity="0.45"/>
  <path d="M248,288 V330" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 5" opacity="0.45"/>
</svg>
