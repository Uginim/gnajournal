<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <text x="10" y="20" font-size="13" font-weight="700" fill="#1f2330">전송량은 윈도우 크기가 아니라 지금까지 쌓인 양입니다</text>
  <text x="516" y="34" text-anchor="end" font-size="11" font-weight="600" fill="#80828f">200k = 컨텍스트 윈도우(한도)</text>

  <!-- 요청 1 : 30k -->
  <text x="10" y="53" font-size="12" font-weight="700" fill="#1f2330">요청 1</text>
  <rect x="86" y="40" width="430" height="18" fill="#f4f4f6" stroke="#cfd0db" stroke-width="1"/>
  <rect x="86" y="40" width="65" height="18" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="157" y="53" font-size="11" fill="#1f2330">약 30k</text>

  <!-- 요청 2 : 32k -->
  <text x="10" y="81" font-size="12" font-weight="700" fill="#1f2330">요청 2</text>
  <rect x="86" y="68" width="430" height="18" fill="#f4f4f6" stroke="#cfd0db" stroke-width="1"/>
  <rect x="86" y="68" width="69" height="18" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="161" y="81" font-size="11" fill="#1f2330">약 32k</text>

  <!-- 요청 10 : 80k -->
  <text x="10" y="109" font-size="12" font-weight="700" fill="#1f2330">요청 10</text>
  <rect x="86" y="96" width="430" height="18" fill="#f4f4f6" stroke="#cfd0db" stroke-width="1"/>
  <rect x="86" y="96" width="172" height="18" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="264" y="109" font-size="11" fill="#1f2330">약 80k</text>

  <!-- 요청 50 : 150k -->
  <text x="10" y="137" font-size="12" font-weight="700" fill="#1f2330">요청 50</text>
  <rect x="86" y="124" width="430" height="18" fill="#f4f4f6" stroke="#cfd0db" stroke-width="1"/>
  <rect x="86" y="124" width="323" height="18" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="415" y="137" font-size="11" fill="#1f2330">약 150k</text>

  <!-- 윈도우 한도 선 -->
  <line x1="516" y1="36" x2="516" y2="146" stroke="#9a9aa5" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 범례 -->
  <rect x="86" y="170" width="14" height="14" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="106" y="181" font-size="11.5" font-weight="600" fill="#5b5fb0">실제 전송, 쌓인 양</text>
  <rect x="270" y="170" width="14" height="14" fill="#f4f4f6" stroke="#cfd0db" stroke-width="1"/>
  <text x="290" y="181" font-size="11.5" font-weight="600" fill="#80828f">빈 공간, 전송 안 함</text>
</svg>
