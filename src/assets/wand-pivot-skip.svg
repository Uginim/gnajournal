<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 346" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="740" height="346" rx="8" fill="#f7f7fb"/>
  <text x="40" y="24" font-size="13" font-weight="700" fill="#1f2330">1회차: 커서 순서대로 상한을 더해 θ를 처음 넘는 곳이 피벗</text>
  <text x="40" y="46" font-size="11.5" fill="#8a8ea3">문서 번호</text>
  <text x="200" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">7</text>
  <text x="248" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">12</text>
  <text x="296" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">20</text>
  <text x="344" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">21</text>
  <text x="392" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">33</text>
  <text x="440" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">41</text>
  <text x="488" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">48</text>
  <text x="536" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">55</text>
  <text x="584" y="46" font-size="12" font-weight="600" fill="#8a8ea3" text-anchor="middle">97</text>
  <rect x="176" y="58" width="96" height="140" fill="#fff4ec" stroke="#d9480f" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="296" y1="56" x2="296" y2="204" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="304" y="218" font-size="12.5" font-weight="700" fill="#4f46e5">피벗 p = 20</text>
  <text x="40" y="85" font-size="13" font-weight="700" fill="#1f2330">맛있는</text>
  <text x="40" y="101" font-size="11.5" fill="#8a8ea3">상한 20</text>
  <line x1="180" y1="80" x2="608" y2="80" stroke="#cfd0db" stroke-width="1.2"/>
  <circle cx="200" cy="80" r="9" fill="#4f46e5"/>
  <circle cx="248" cy="80" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <circle cx="296" cy="80" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <circle cx="344" cy="80" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <circle cx="392" cy="80" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <circle cx="488" cy="80" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <text x="40" y="135" font-size="13" font-weight="700" fill="#1f2330">치즈</text>
  <text x="40" y="151" font-size="11.5" fill="#8a8ea3">상한 30</text>
  <line x1="180" y1="130" x2="608" y2="130" stroke="#cfd0db" stroke-width="1.2"/>
  <circle cx="200" cy="130" r="9" fill="#4f46e5"/>
  <circle cx="296" cy="130" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <circle cx="536" cy="130" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <text x="40" y="185" font-size="13" font-weight="700" fill="#1f2330">피자</text>
  <text x="40" y="201" font-size="11.5" fill="#8a8ea3">상한 50</text>
  <line x1="180" y1="180" x2="608" y2="180" stroke="#cfd0db" stroke-width="1.2"/>
  <circle cx="296" cy="180" r="9" fill="#4f46e5"/>
  <circle cx="440" cy="180" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <circle cx="584" cy="180" r="8" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <path d="M200 69 Q248.0 50 293 68" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
  <path d="M286 63 L294 69 L285 72" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="628" y="46" font-size="11.5" font-weight="600" fill="#8a8ea3">상한 누적</text>
  <text x="628" y="85" font-size="13.5" font-weight="700" fill="#8a8ea3">20</text>
  <text x="662" y="85" font-size="12" fill="#8a8ea3">≤ θ 60</text>
  <text x="628" y="135" font-size="13.5" font-weight="700" fill="#8a8ea3">50</text>
  <text x="662" y="135" font-size="12" fill="#8a8ea3">≤ θ 60</text>
  <text x="628" y="185" font-size="13.5" font-weight="700" fill="#4f46e5">100</text>
  <text x="662" y="185" font-size="12" font-weight="600" fill="#4f46e5">> θ 60</text>
  <text x="40" y="250" font-size="12.5" font-weight="600" fill="#d9480f">주황 구간(문서 20 미만)에는 피자가 없습니다. 맛있는과 치즈만 있어 많아야 20 + 30 = 50점입니다.</text>
  <text x="40" y="272" font-size="12.5" font-weight="600" fill="#d9480f">50은 θ 60을 넘지 못하므로 이 구간의 문서는 상위 k에 들 수 없습니다.</text>
  <text x="40" y="300" font-size="12.5" font-weight="600" fill="#5b5fb0">그래서 문서 12를 채점하지 않고, 맛있는의 커서를 피벗 20으로 seek합니다.</text>
  <circle cx="44" cy="318" r="6" fill="#4f46e5"/>
  <text x="56" y="322" font-size="11.5" fill="#8a8ea3">커서 위치</text>
  <circle cx="134" cy="318" r="6" fill="#ffffff" stroke="#8a8ea3" stroke-width="1.4"/>
  <text x="146" y="322" font-size="11.5" fill="#8a8ea3">포스팅 항목</text>
</svg>
