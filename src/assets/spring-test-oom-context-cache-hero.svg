<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 574" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1020" height="574" fill="#f7f7fb"/>

  <text x="90" y="78" font-size="28" font-weight="700" fill="#1f2330">테스트 수백 개, 힙에 남는 Spring 컨텍스트는 몇 개일까</text>

  <!-- 왼쪽: DB 이름 고정 -->
  <text x="260" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">H2 DB 이름 고정</text>
  <rect x="110" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <text x="260" y="290" text-anchor="middle" font-size="16" fill="#a0a2b0">여유</text>
  <rect x="126" y="356" width="268" height="48" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="260" y="387" text-anchor="middle" font-size="17" fill="#4f46e5">컨텍스트 1개, 캐시 재사용</text>
  <text x="260" y="455" text-anchor="middle" font-size="17" font-weight="600" fill="#4f46e5">캐시 적중</text>

  <!-- 오른쪽: 테스트마다 다른 이름 -->
  <text x="760" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2330">테스트마다 다른 DB 이름</text>
  <rect x="610" y="185" width="300" height="235" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <rect x="626" y="368" width="268" height="44" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="760" y="397" text-anchor="middle" font-size="17" fill="#d9480f">컨텍스트 1</text>
  <rect x="626" y="316" width="268" height="44" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="760" y="345" text-anchor="middle" font-size="17" fill="#d9480f">컨텍스트 2</text>
  <rect x="626" y="264" width="268" height="44" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="760" y="293" text-anchor="middle" font-size="17" fill="#d9480f">컨텍스트 3</text>
  <rect x="626" y="212" width="268" height="44" rx="6" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
  <text x="760" y="241" text-anchor="middle" font-size="17" fill="#d9480f">컨텍스트 4</text>
  <rect x="626" y="160" width="268" height="44" rx="6" fill="#fbe0d3" stroke="#d9480f" stroke-width="2.5"/>
  <text x="760" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#d9480f">컨텍스트 N…</text>
  <text x="760" y="455" text-anchor="middle" font-size="17" font-weight="700" fill="#d9480f">OutOfMemoryError</text>

  <text x="90" y="497" font-size="19" font-weight="600" fill="#1f2330">DB 이름이 컨텍스트 캐시 키에 들어가서, 이름이 다르면 재사용 없이 힙에 컨텍스트가 쌓입니다.</text>
</svg>
