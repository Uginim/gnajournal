<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 574" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1020" height="574" fill="#f7f7fb"/>
  <text x="80" y="76" font-size="26" font-weight="700" fill="#1f2330">입금자명으로 거래처 찾기: difflib와 BM25</text>
  <text x="80" y="112" font-size="18" fill="#7a7c88">가상 입금자명 「우투농산」의 1위 후보 (모든 이름과 값은 가상)</text>

  <rect x="80" y="150" width="410" height="270" rx="8" fill="#ffffff" stroke="#c6c8d4" stroke-width="2"/>
  <text x="285" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2330">difflib: 모든 글자가 같은 무게</text>
  <rect x="106" y="214" width="358" height="40" rx="6" fill="#fff4ec" stroke="#d9480f" stroke-width="2"/>
  <text x="122" y="240" font-size="16" font-weight="700" fill="#d9480f">1위  우누농산</text>
  <text x="448" y="240" text-anchor="end" font-size="16" font-weight="700" fill="#d9480f">0.75</text>
  <rect x="106" y="266" width="358" height="40" rx="6" fill="#ffffff" stroke="#c6c8d4" stroke-width="1.5"/>
  <text x="122" y="292" font-size="16" fill="#5b5d6b">정답  우투농산 1센터</text>
  <text x="448" y="292" text-anchor="end" font-size="16" fill="#5b5d6b">0.67</text>
  <text x="285" y="350" text-anchor="middle" font-size="16" fill="#5b5fb0">ratio = 2 × 공통 글자 / 두 길이의 합</text>
  <text x="285" y="385" text-anchor="middle" font-size="15" fill="#7a7c88">지점명이 붙으면 분모가 커진다</text>

  <rect x="530" y="150" width="410" height="270" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="735" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2330">BM25: 드문 토큰이 무겁다</text>
  <rect x="556" y="214" width="358" height="40" rx="6" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="572" y="240" font-size="16" font-weight="700" fill="#4f46e5">1위  우투농산 1센터</text>
  <text x="898" y="240" text-anchor="end" font-size="16" font-weight="700" fill="#4f46e5">정답</text>
  <text x="572" y="292" font-size="16" fill="#5b5d6b">우투 6곳 → IDF 5.44</text>
  <text x="572" y="320" font-size="16" fill="#5b5d6b">투농 5곳 → IDF 5.61</text>
  <text x="572" y="348" font-size="16" fill="#5b5d6b">농산 130곳 → IDF 2.44</text>
  <text x="735" y="390" text-anchor="middle" font-size="15" fill="#7a7c88">상호를 가려 주는 글자가 점수를 정한다</text>

  <text x="80" y="474" font-size="19" font-weight="600" fill="#1f2330">가상 입금자명 900건에서 1위 상호가 맞은 비율</text>
  <text x="80" y="508" font-size="19" font-weight="600" fill="#1f2330">BM25 100%, difflib 77%</text>
  <text x="80" y="542" font-size="16" fill="#7a7c88">가상 거래처 1,500곳으로 측정</text>
</svg>
