<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="360" height="250" rx="8" fill="#f7f7fb"/>
  <defs>
    <marker id="fdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a96"/>
    </marker>
  </defs>

  <!-- 결정자 -->
  <text x="180" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#5b5fb0">결정자 (A)</text>
  <rect x="90" y="36" width="180" height="52" rx="9" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="180" y="69" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2330">회원ID</text>

  <!-- dependency arrow -->
  <line x1="180" y1="90" x2="180" y2="157" stroke="#8a8a96" stroke-width="1.7" marker-end="url(#fdArrow)"/>
  <text x="194" y="129" font-size="15" font-weight="600" fill="#555">함수적 종속 A → B</text>

  <!-- 종속자 -->
  <rect x="90" y="160" width="180" height="52" rx="9" fill="#f7f7fb" stroke="#cfd0db" stroke-width="1.4"/>
  <text x="180" y="193" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2330">이름</text>
  <text x="180" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#80828f">종속자 (B)</text>
</svg>
