<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="380" height="300" rx="8" fill="#f7f7fb"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a96"/>
    </marker>
    <marker id="arrow2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>

  <!-- 후보키 (복합키) -->
  <rect x="20" y="20" width="340" height="96" rx="10" fill="#f4f6ff" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="190" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#5b5fb0">후보키 (복합키)</text>
  <rect x="40" y="58" width="140" height="40" rx="7" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="110" y="84" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2330">학번</text>
  <rect x="200" y="58" width="140" height="40" rx="7" fill="#ffffff" stroke="#cfd0db" stroke-width="1.2"/>
  <text x="270" y="84" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2330">과목코드</text>

  <!-- 완전 함수적 종속: 키 전체에서 성적으로 -->
  <line x1="190" y1="118" x2="112" y2="236" stroke="#8a8a96" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="20" y="152" font-size="15" font-weight="600" fill="#555">완전 함수적 종속</text>

  <!-- 부분 함수적 종속: 과목코드에서 과목명으로 -->
  <line x1="270" y1="100" x2="270" y2="236" stroke="#d9480f" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow2w)"/>
  <text x="262" y="206" text-anchor="end" font-size="15" font-weight="600" fill="#d9480f">부분 함수적 종속</text>

  <rect x="40" y="240" width="140" height="46" rx="9" fill="#f7f7fb" stroke="#cfd0db" stroke-width="1.4"/>
  <text x="110" y="269" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2330">성적</text>
  <rect x="200" y="240" width="140" height="46" rx="9" fill="#f7f7fb" stroke="#cfd0db" stroke-width="1.4"/>
  <text x="270" y="269" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2330">과목명</text>
</svg>
