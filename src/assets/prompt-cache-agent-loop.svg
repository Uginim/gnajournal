<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 214" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="al" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9a9aa5"/>
    </marker>
  </defs>
  <text x="10" y="18" font-size="13" font-weight="700" fill="#1f2330">사용자 입력 한 번이 여러 API 요청을 만듭니다</text>

  <rect x="200" y="30" width="160" height="26" fill="#eef9f0" stroke="#2f9e44" stroke-width="1.3"/>
  <text x="280" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">사용자 입력 1회</text>
  <path d="M280,56 V72" fill="none" stroke="#9a9aa5" stroke-width="1.2" marker-end="url(#al)"/>

  <!-- 요청 1 -->
  <text x="10" y="95" font-size="12" font-weight="700" fill="#1f2330">요청 1</text>
  <rect x="66" y="80" width="216" height="26" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="74" y="97" font-size="10.5" fill="#4f46e5">보냄: 전체 컨텍스트</text>
  <text x="292" y="97" font-size="12" fill="#80828f">→</text>
  <rect x="312" y="80" width="222" height="26" fill="#eef9f0" stroke="#2f9e44" stroke-width="1.2"/>
  <text x="320" y="97" font-size="10.5" fill="#2f9e44">받음: Bash 실행 요청</text>

  <!-- 요청 2 -->
  <text x="10" y="133" font-size="12" font-weight="700" fill="#1f2330">요청 2</text>
  <rect x="66" y="118" width="216" height="26" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="74" y="135" font-size="10.5" fill="#4f46e5">보냄: 컨텍스트 + Bash 결과</text>
  <text x="292" y="135" font-size="12" fill="#80828f">→</text>
  <rect x="312" y="118" width="222" height="26" fill="#eef9f0" stroke="#2f9e44" stroke-width="1.2"/>
  <text x="320" y="135" font-size="10.5" fill="#2f9e44">받음: Read 실행 요청</text>

  <!-- 요청 3 -->
  <text x="10" y="171" font-size="12" font-weight="700" fill="#1f2330">요청 3</text>
  <rect x="66" y="156" width="216" height="26" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="74" y="173" font-size="10.5" fill="#4f46e5">보냄: 컨텍스트 + 결과 2개</text>
  <text x="292" y="173" font-size="12" fill="#80828f">→</text>
  <rect x="312" y="156" width="222" height="26" fill="#eef9f0" stroke="#2f9e44" stroke-width="1.2"/>
  <text x="320" y="173" font-size="10.5" fill="#2f9e44">받음: 다음 툴 실행 요청</text>

  <text x="10" y="205" font-size="11.5" font-weight="600" fill="#5b5fb0">각 요청이 툴 실행을 요청하고, 돌아온 결과가 다음 요청에 쌓입니다.</text>
</svg>
